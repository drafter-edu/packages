
name: Build ChemPy wheels and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel packaging

      - name: Build and collect pure-Python wheels
        run: |
          mkdir -p dist/wheels
          python -m pip wheel --no-deps \
            --wheel-dir dist/wheels \
            -r wheel-requirements.txt

      - name: Validate wheels and write manifest
        run: python scripts/build_manifest.py dist/wheels dist/wheels.json

      - name: Stage GitHub Pages site
        run: |
          cp site/index.html dist/index.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
